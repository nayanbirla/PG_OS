# ===========================
# PG OS — Dev Profile
# ===========================

spring:
  # Database (Local Docker PostgreSQL)
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pgos_dev}
    username: ${SPRING_DATASOURCE_USERNAME:pgos}
    password: ${SPRING_DATASOURCE_PASSWORD:pgos_dev_password}
    hikari:
      maximum-pool-size: 5

  # Redis (Local Docker Redis)
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}

  # JPA — show SQL in dev
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Flyway
  flyway:
    clean-disabled: false

# Logging — verbose in dev
logging:
  level:
    com.pgos: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
