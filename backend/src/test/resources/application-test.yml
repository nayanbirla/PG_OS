# Test profile — uses H2 in-memory database to avoid Docker dependency in tests
spring:
  datasource:
    url: jdbc:h2:mem:pgos_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: test-secret-key-for-unit-tests-must-be-at-least-256-bits-long-for-hmac-sha
  access-token-expiry-ms: 900000
  refresh-token-expiry-ms: 604800000

logging:
  level:
    com.pgos: DEBUG
