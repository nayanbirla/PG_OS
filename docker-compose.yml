version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: pgos-postgres
    environment:
      POSTGRES_DB: pgos_dev
      POSTGRES_USER: pgos
      POSTGRES_PASSWORD: pgos_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgos_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgos -d pgos_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pgos-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgos_data:
